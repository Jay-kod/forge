version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: production
    image: forge-app:latest
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_URL: ${APP_URL:-http://localhost:8088}
      APP_KEY: ${APP_KEY:-base64:4OqGg3J4a/ipJ5y7GGYf116bUJGH08JaIWS7NTRzptA=}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-forge}
      DB_USERNAME: ${DB_USERNAME:-forge}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - storage-data:/var/www/html/storage
    networks:
      - forge-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: nginx
    image: forge-nginx:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8088}:80"
      - "${SSL_PORT:-8443}:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - storage-data:/var/www/html/storage:ro
    networks:
      - forge-network
    depends_on:
      - app

  worker:
    image: forge-app:latest
    restart: unless-stopped
    command: php artisan queue:work redis --queue=ai,research,export,billing,default --tries=3 --timeout=180 --sleep=2
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_KEY: ${APP_KEY:-base64:4OqGg3J4a/ipJ5y7GGYf116bUJGH08JaIWS7NTRzptA=}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-forge}
      DB_USERNAME: ${DB_USERNAME:-forge}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - storage-data:/var/www/html/storage
    networks:
      - forge-network
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy

  scheduler:
    image: forge-app:latest
    restart: unless-stopped
    command: php artisan schedule:work
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_KEY: ${APP_KEY:-base64:4OqGg3J4a/ipJ5y7GGYf116bUJGH08JaIWS7NTRzptA=}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-forge}
      DB_USERNAME: ${DB_USERNAME:-forge}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - storage-data:/var/www/html/storage
    networks:
      - forge-network
    depends_on:
      app:
        condition: service_started

  redis:
    image: redis:alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - forge-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-forge}
      MYSQL_USER: ${DB_USERNAME:-forge}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - forge-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-prootsecret"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  storage-data:
  redis-data:
  mysql-data:

networks:
  forge-network:
    driver: bridge
